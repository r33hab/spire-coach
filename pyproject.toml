[project]
name = "spire-coach"
version = "0.1.0"
description = "Offline Slay the Spire 2 coach and autopilot"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.27,<1",
    "pywebview>=6.2.1",
    "uvicorn>=0.54.0",
    "websockets>=17.1",
]

[project.scripts]
spire-coach = "coach.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
